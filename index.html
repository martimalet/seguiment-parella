<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguiment Parella</title>
  
  <!-- El cor groc que volies -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 120%22><text x=%2210%22 y=%2295%22 font-size=%2290%22>💛</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 120%22><text x=%2210%22 y=%2295%22 font-size=%2290%22>💛</text></svg>">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
    .app { max-width: 440px; margin: 0 auto; padding: 1rem; }
    .header { text-align: center; padding: 1.5rem 0 1rem; }
    .header h1 { font-size: 22px; font-weight: 600; color: #0f172a; }
    .live-badge { background: #dcfce7; color: #166534; font-size: 11px; padding: 3px 10px; border-radius: 20px; display: inline-block; margin-top: 6px; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 1rem 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .card h2 { font-size: 14px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
    
    /* BOTÓ PRINCIPAL (Original d'en Claude) */
    .btn-principal { width: 100%; padding: 1rem; font-size: 16px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; background: #ef4444; color: white; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2); }
    .btn-principal:active { transform: scale(0.98); }
    .btn-principal.ja-registrat { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; box-shadow: none; cursor: default; }
    .status-msg { text-align: center; font-size: 13px; margin-top: 6px; min-height: 18px; font-weight: 500; }
    .status-msg.error { color: #ef4444; }
    .status-msg.success { color: #10b981; }

    /* FILTRE ANY */
    .selector-any { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .selector-any span { font-weight: 600; color: #334155; }
    select { padding: 0.4rem 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; background: white; font-size: 14px; font-weight: 500; color: #334155; outline: none; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    .stat-box { background: #f1f5f9; padding: 0.75rem; border-radius: 10px; text-align: center; }
    .stat-val { font-size: 22px; font-weight: 700; color: #0f172a; }
    .stat-lbl { font-size: 11px; color: #64748b; margin-top: 2px; font-weight: 500; }

    /* GRÀFICA (Original arreglada per no desbordar) */
    .grafica-contenidor { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .barra-fila { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .barra-nom { width: 35px; color: #475569; font-weight: 500; }
    .barra-fons { background: #e2e8f0; flex-grow: 1; height: 16px; border-radius: 4px; overflow: hidden; position: relative; max-width: calc(100% - 75px); } /* Línia corregida */
    .barra-color { background: #ef4444; height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .barra-num { width: 25px; text-align: right; color: #0f172a; font-weight: 600; }

    /* CALENDARI */
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .cal-titol { font-size: 15px; font-weight: 600; color: #334155; }
    .cal-nav { background: none; border: none; font-size: 16px; cursor: pointer; color: #64748b; padding: 4px 8px; }
    .cal-dies-nom { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; }
    .cal-quadricula { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-dia { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; border-radius: 8px; color: #334155; position: relative; cursor: pointer; }
    .cal-dia.fora { color: #cbd5e1; cursor: default; }
    .cal-dia.intim { background: #fee2e2; color: #991b1b; font-weight: 700; border: 1px solid #fca5a5; }
    .cal-dia.intim::after { content: '❤️'; font-size: 9px; position: absolute; bottom: 1px; }
    .cal-dia.periode-predit { background: #f3e8ff; color: #6b21a8; border: 1px dashed #c084fc; }
    .cal-dia.avui { border: 2px solid #3b82f6; }

    .llegenda { display: flex; gap: 12px; font-size: 11px; font-weight: 500; color: #64748b; justify-content: center; margin-top: 10px; }
    .llegenda-item { display: flex; align-items: center; gap: 4px; }
    .ll-punt { width: 10px; height: 10px; border-radius: 3px; }
    .selector-usuari { display: flex; justify-content: center; gap: 8px; margin-top: 0.5rem; }
    .btn-usuari { background: #e2e8f0; border: none; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #475569; cursor: pointer; }
    .btn-usuari.actiu { background: #334155; color: white; }
    
    .consell-text { font-size: 13px; line-height: 1.4; color: #475569; font-style: italic; background: #fffbeb; padding: 10px; border-radius: 8px; border-left: 3px solid #f59e0b; }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Seguiment Actiu</h1>
    <div class="live-badge">✓ Sincronitzat al núvol</div>
  </div>

  <div class="card">
    <button id="btn-avui" class="btn-principal" onclick="registrarAvui()">❤️ Trobada avui!</button>
    <div id="status-avui" class="status-msg"></div>
  </div>

  <div class="card">
    <div class="selector-any">
      <h2>Estadístiques</h2>
      <select id="any-filter" onchange="canviAny()"></select>
    </div>
    <div class="stats-grid">
      <div class="stat-box">
        <div id="stat-total" class="stat-val">0</div>
        <div class="stat-lbl">Trobades totals</div>
      </div>
      <div class="stat-box">
        <div id="stat-mitjana" class="stat-val">0</div>
        <div class="stat-lbl">Mitjana mensual</div>
      </div>
    </div>
    <div id="grafica-mesos" class="grafica-contenidor"></div>
  </div>

  <div class="card">
    <div class="cal-header">
      <button class="cal-nav" onclick="mesAnterior()">◀</button>
      <div id="cal-mes-titol" class="cal-titol"></div>
      <button class="cal-nav" onclick="mesSeguent()">▶</button>
    </div>
    <div class="cal-dies-nom">
      <div>dl</div><div>dt</div><div>dc</div><div>dj</div><div>dv</div><div>ds</div><div>dg</div>
    </div>
    <div id="cal-quadricula" class="cal-quadricula"></div>
    <div class="llegenda">
      <div class="llegenda-item"><div class="ll-punt" style="background:#fee2e2; border:1px solid #fca5a5;"></div> Trobada</div>
      <div class="llegenda-item"><div class="ll-punt" style="background:#f3e8ff; border:1px dashed #c084fc;"></div> Regla (Predit)</div>
    </div>
  </div>

  <div class="card">
    <h2>Estat del Cicle i Consell</h2>
    <div id="consell-cos" class="consell-text">Carregant dades del cicle...</div>
  </div>

  <div class="selector-usuari">
    <button id="u-marti" class="btn-usuari actiu" onclick="canviUsuari('Martí')">Martí</button>
    <button id="u-helena" class="btn-usuari" onclick="canviUsuari('Helena')">Helena</button>
  </div>
</div>

<script>
  // Les teves credencials de Supabase reals
  const SUPA_URL = "https://mbybvphxztjsrptazqge.supabase.co";
  const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ieWJ2cGh4enRqc3JwdGF6cWdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMzYzMzQsImV4cCI6MjA5NTYxMjMzNH0.do9NgiXYPda8iV1N-CMepc4BnzOu5IpU5CNKct6kw7M";
  
  const HEADERS = { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Content-Type": "application/json" };

  let dades = {};
  let usuariActual = 'Martí';
  const avui = new Date();
  let anyActual = avui.getFullYear();
  let mesVisualitzat = avui.getMonth();
  let anyVisualitzat = avui.getFullYear();

  const mesosNoms = ["Gener", "Febrer", "Març", "Abril", "Maig", "Juny", "Juliol", "Agost", "Setembre", "Octubre", "Novembre", "Desembre"];

  window.onload = async function() {
    poblarAnys();
    await carregarDadesBD();
    calcularPrediccions();
    renderTot();
  };

  function poblarAnys() {
    const sel = document.getElementById('any-filter');
    for(let a = anyActual; a >= anyActual - 2; a--) {
      let o = document.createElement('option'); o.value = a; o.textContent = a; sel.appendChild(o);
    }
  }

  async function carregarDadesBD() {
    try {
      const r = await fetch(SUPA_URL + '/rest/v1/registres?user_id=eq.' + usuariActual + '&select=*', { method: 'GET', headers: HEADERS });
      if(!r.ok) throw new Error();
      const llista = await r.json();
      dades = {};
      llista.forEach(i => { dades[i.data] = i.tipus; });
    } catch(e) {
      document.getElementById('status-avui').textContent = "Error de connexió amb la base de dades.";
    }
  }

  function clauData(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function calcularPrediccions() {
    for (let k in dades) { if(dades[k] === 'periode-predit') delete dades[k]; }
    let clausIntimes = Object.keys(dades).filter(k => dades[k] === 'intim').sort();
    if(clausIntimes.length < 2) return;

    let darrere = new Date(clausIntimes[clausIntimes.length - 1]);
    for(let i=1; i<=3; i++) {
      let predit = new Date(darrere);
      predit.setDate(predit.getDate() + (i * 28));
      for(let j=0; j<4; j++) {
        let pDia = new Date(predit); pDia.setDate(pDia.getDate() + j);
        let c = clauData(pDia);
        if(!dades[c]) dades[c] = 'periode-predit';
      }
    }
  }

  function renderTot() {
    renderBotoAvui();
    renderEstadistiques();
    renderCalendari();
    renderConsell();
  }

  function renderBotoAvui() {
    const clau = clauData(avui);
    const btn = document.getElementById('btn-avui');
    const info = document.getElementById('status-avui');
    if (dades[clau] === 'intim') {
      btn.textContent = '✓ Registrat avui';
      btn.classList.add('ja-registrat');
      info.textContent = 'Ja has guardat la trobada d’avui!';
      info.className = "status-msg success";
    } else {
      btn.textContent = '❤️ Trobada avui!';
      btn.classList.remove('ja-registrat');
      info.textContent = '';
    }
  }

  function renderEstadistiques() {
    const anyFiltre = document.getElementById('any-filter').value;
    let total = 0;
    let mesosComptador = Array(12).fill(0);

    for (let clau in dades) {
      if (dades[clau] === 'intim' && clau.startsWith(anyFiltre)) {
        total++;
        let m = parseInt(clau.split('-')[1]) - 1;
        mesosComptador[m]++;
      }
    }

    document.getElementById('stat-total').textContent = total;
    let mesosActius = anyFiltre == anyActual ? (avui.getMonth() + 1) : 12;
    document.getElementById('stat-mitjana').textContent = (total / mesosActius).toFixed(1);

    const maxMes = Math.max(...mesosComptador, 1);
    let htmlGrafica = "";
    mesosNoms.forEach((nom, idx) => {
      let v = mesosComptador[idx];
      let pct = (v / maxMes) * 100;
      htmlGrafica += `
        <div class="barra-fila">
          <div class="barra-nom">${nom.substring(0,3)}</div>
          <div class="barra-fons">
            <div class="barra-color" style="width: ${pct}%"></div>
          </div>
          <div class="barra-num">${v}</div>
        </div>`;
    });
    document.getElementById('grafica-mesos').innerHTML = htmlGrafica;
  }

  function renderCalendari() {
    document.getElementById('cal-mes-titol').textContent = `${mesosNoms[mesVisualitzat]} ${anyVisualitzat}`;
    const q = document.getElementById('cal-quadricula');
    q.innerHTML = "";

    let primerDiaMes = new Date(anyVisualitzat, mesVisualitzat, 1).getDay();
    let diesEnMes = new Date(anyVisualitzat, mesVisualitzat + 1, 0).getDate();
    let iniciEspais = primerDiaMes === 0 ? 6 : primerDiaMes - 1;

    let diesMesAnterior = new Date(anyVisualitzat, mesVisualitzat, 0).getDate();
    for (let i = iniciEspais - 1; i >= 0; i--) {
      let d = document.createElement('div'); d.className = "cal-dia fora"; d.textContent = diesMesAnterior - i; q.appendChild(d);
    }

    for (let i = 1; i <= diesEnMes; i++) {
      let d = document.createElement('div'); d.className = "cal-dia"; d.textContent = i;
      let dataObjecte = new Date(anyVisualitzat, mesVisualitzat, i);
      let clau = clauData(dataObjecte);

      if (dades[clau] === 'intim') d.classList.add('intim');
      if (dades[clau] === 'periode-predit') d.classList.add('periode-predit');
      if (clau === clauData(avui)) d.classList.add('avui');

      d.onclick = () => alternarDia(dataObjecte);
      q.appendChild(d);
    }
  }

  async function alternarDia(dataObj) {
    const clau = clauData(dataObj);
    const tipusActual = dades[clau];
    try {
      if (tipusActual === 'intim') {
        delete dades[clau];
        await fetch(`${SUPA_URL}/rest/v1/registres?user_id=eq.${usuariActual}&data=eq.${clau}`, { method: 'DELETE', headers: HEADERS });
      } else {
        dades[clau] = 'intim';
        await fetch(`${SUPA_URL}/rest/v1/registres`, { method: 'POST', headers: HEADERS, body: JSON.stringify({ user_id: usuariActual, data: clau, tipus: 'intim' }) });
      }
      calcularPrediccions(); renderTot();
    } catch(e) {}
  }

  function renderConsell() {
    let text = "Mantingues el teu registre diari actiu per veure recomanacions basades en el cicle.";
    let clausIntimes = Object.keys(dades).filter(k => dades[k] === 'intim').sort();
    if (clausIntimes.length > 0) {
      let ultima = new Date(clausIntimes[clausIntimes.length - 1]);
      let difTemps = avui - ultima;
      let diesPasats = Math.floor(difTemps / (1000 * 60 * 60 * 24));
      
      if(diesPasats <= 3) text = "✨ Fase òptima d'energia. Bon moment per fer activitat física de fons o plans dinàmics en parella.";
      else if(diesPasats > 3 && diesPasats <= 10) text = "⚡ Dies de màxima productivitat i comunicació oberta. Ideal per connectar.";
      else text = "🧘 Fase de relaxació i autocura recomanada. Prioritzeu descans i sopars tranquils a casa.";
    }
    document.getElementById('consell-cos').textContent = text;
  }

  async function registrarAvui() {
    const clau = clauData(avui);
    if (dades[clau] === 'intim') return;
    const btn = document.getElementById('btn-avui');
    btn.textContent = 'Guardant...';
    try {
      await fetch(SUPA_URL + '/rest/v1/registres', { method: 'POST', headers: HEADERS, body: JSON.stringify({ user_id: usuariActual, data: clau, tipus: 'intim' }) });
      dades[clau] = 'intim'; calcularPrediccions(); renderTot();
    } catch (e) { 
      btn.textContent = '❤️ Trobada avui!'; 
      document.getElementById('status-avui').textContent = 'Error de connexió.';
    }
  }

  function canviAny() { renderEstadistiques(); }
  function mesAnterior() { mesVisualitzat--; if(mesVisualitzat < 0) { mesVisualitzat = 11; anyVisualitzat--; } renderCalendari(); }
  function mesSeguent() { mesVisualitzat++; if(mesVisualitzat > 11) { mesVisualitzat = 0; anyVisualitzat++; } renderCalendari(); }
  async function canviUsuari(u) {
    usuariActual = u;
    document.getElementById('u-marti').classList.toggle('actiu', u === 'Martí');
    document.getElementById('u-helena').classList.toggle('actiu', u === 'Helena');
    await carregarDadesBD(); calcularPrediccions(); renderTot();
  }
</script>
</body>
</html>
